name: attend_ease
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  table_calendar: ^3.1.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.2.1

  connectivity_plus: ^7.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  sqflite_common_ffi_web: ^1.1.1
  file_picker: ^10.3.10
  http: ^1.6.0
  url_launcher: ^6.3.2
  syncfusion_flutter_pdf: ^33.1.49
  go_router: ^17.2.2
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


  assets:
    - assets/icon/app_icon2.png
    - assets/icon/app_icon.jpg
    - assets/icon/google_logo.png
    - assets/github.svg
    - assets/android.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon2.png"