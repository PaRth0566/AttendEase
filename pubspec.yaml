name: attend_ease
description: "AttendEase - a privacy-conscious attendance tracker with PDF insights and cloud sync."
publish_to: 'none'

version: 1.1.1+7

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  table_calendar: ^3.1.1

  # No app code imports this, but do not drop it: the vendored
  # liquid_glass_widgets draws `CupertinoIcons.chevron_forward` and
  # `CupertinoIcons.info` in glass_list_tile.dart without declaring the package
  # itself. `package:flutter/cupertino.dart` supplies the `CupertinoIcons`
  # class; only this package ships the font the glyphs live in. Without it the
  # web build warns "Expected to find fonts for (..., CupertinoIcons)" and those
  # glyphs paint as blank boxes. Tree-shaking makes it near-free when unused.
  cupertino_icons: ^1.0.8

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.2.1

  connectivity_plus: ^7.0.0
  pdf: ^3.12.0
  share_plus: ^12.0.2
  sqflite_common_ffi_web: ^1.1.1
  file_picker: ^10.3.10
  http: ^1.6.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2
  syncfusion_flutter_pdf: ^33.1.49
  go_router: ^17.2.2
  flutter_svg: ^2.1.0

  # Google Play in-app updates (flexible flow) and in-app reviews. Android-only;
  # both are no-ops on web and on non-Play (dev/sideloaded) builds. See
  # lib/services/play_update_service.dart and lib/services/review_service.dart.
  in_app_update: ^5.0.0
  in_app_review: ^2.0.12

  # Directly-imported packages (previously resolved transitively). Declared
  # explicitly per pub best practice. flutter_web_plugins ships with the SDK.
  flutter_web_plugins:
    sdk: flutter
  path: ^1.9.0
  web: ^1.1.0
  http_parser: ^4.1.0
  liquid_glass_widgets: ^0.18.4

# A vendored copy of liquid_glass_widgets 0.18.4, patched in one place.
#
# The nav bar's selection pill deformed the wrong way as it travelled: the
# package squashes the indicator *along* its direction of motion and stretches
# it across, so on the full-width Dashboard->Profile trip the pill necked down
# to roughly half its width and sprang back on arrival, which reads as it
# vanishing and reappearing rather than sliding. The two constants that drive
# it are literals inside the package with no parameter reaching them, so the
# only way to change it is to own the source.
#
# The delta is small and marked with `AttendEase patch:` comments — see
# third_party/liquid_glass_widgets/README.attendease.md before upgrading.
dependency_overrides:
  liquid_glass_widgets:
    path: third_party/liquid_glass_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


  assets:
    - assets/icon/app_icon2.png
    - assets/icon/google_logo.png
    - assets/github.svg
    # Rests inside the dashboard's circular sync button — see
    # lib/widgets/sync_report_button.dart.
    - assets/icon/upload_pdf_icon.png
    # Rests inside the dashboard's circular SAP portal button, immediately left
    # of the sync button — see lib/widgets/sap_portal_button.dart.
    - assets/icon/sap_icon.png

  # Bundled text font. With no explicit family Flutter falls back to Roboto,
  # which the CanvasKit web renderer pulls from fonts.gstatic.com on first
  # paint. A slow or blocked request means the web build measures every string
  # correctly and then draws no glyphs — icons and card outlines appear, all
  # text is invisible. Bundling removes that network dependency for good.
  #
  # Weights map to the ones the UI actually asks for: w400/w500 -> Regular,
  # w600 -> SemiBold, w700/w800/w900 -> Bold. Flutter synthesises the rest.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon2.png"
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
