org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Folds resources into R8's reference graph instead of shrinking them separately
# through AAPT2-generated keep rules, so a resource reachable only from code R8
# deleted goes away too. Must be requested explicitly on AGP 8.12-8.13; becomes
# the default in AGP 9.0. Ticks Play Console's "Resource Shrinking Optimized"
# row. Pairs with isShrinkResources in app/build.gradle.kts, which is what
# actually turns shrinking on.
android.r8.optimizedResourceShrinking=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
