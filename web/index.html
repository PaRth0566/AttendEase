<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Without this a mobile browser assumes a ~980px layout viewport and scales
       the whole page down to fit, so the app never actually renders at mobile
       width — which is why the desktop-width bugs in DESKTOP_WEB_FIX_PLAN.md
       were not caught on a phone browser either. viewport-fit=cover lets the
       page extend under the notch/home indicator, matching the edge-to-edge
       rendering the app already sets up natively. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AttendEase - a privacy-conscious attendance tracker with PDF insights and cloud sync.">
  <meta name="google-signin-client_id" content="645842511929-jr72m5715907vmh716ja48eer2k4dgto.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AttendEase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AttendEase</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter web routes text input through real <input>/<textarea> elements
       overlaid on the canvas. The browser styles those natively, which shows
       through as artefacts around Flutter TextFields:

         - `outline` is the focus ring (blue in Chrome).
         - `border` is the input's own default border — this is the rounded
           blue-when-focused / grey-when-idle capsule that appeared inside the
           target fields. Clearing `outline` alone does not remove it.
         - `appearance` stops the platform widget look (and the number-input
           spinners) from being reintroduced.

       Flutter paints the real field on the canvas underneath, so the overlaid
       element must be visually inert — background and border included. */
    input,
    textarea,
    [contenteditable="true"],
    flt-text-editing-host input,
    flt-text-editing-host textarea,
    .flt-text-editing {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      -webkit-appearance: none !important;
      appearance: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Number inputs also render increment/decrement spinners, which would sit
       on top of the canvas-painted field. */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none !important;
      margin: 0 !important;
    }

    input[type="number"] {
      -moz-appearance: textfield !important;
    }

    /* ── First-paint background ────────────────────────────────────────────
       Until Flutter's engine has downloaded, compiled and rendered its first
       frame, the page is genuinely empty. Painting the app's own scaffold
       colour straight from HTML means that gap reads as the app still loading
       rather than as a white flash followed by a dark page.

       There is deliberately no logo or spinner here. The previous placeholder
       showed web/icons/Icon-192.png, which at the time was still Flutter's
       default template artwork, so it flashed the Flutter logo on every cold
       load. Those icons are branded now, but the bare background is kept: it
       cannot go stale the way an image reference can.

       Defaults to the light background and switches via prefers-color-scheme,
       which matches ThemeMode.system on a fresh visit. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #F1F5F9;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background-color: #020617; }
    }
  </style>
</head>
<body>
  <script>
    // Drag-and-drop bridge for Flutter web (works with CanvasKit & SkWasm)
    // Runs outside Flutter's shadow root so events are always captured.
    var _dragCounter = 0;

    document.addEventListener('dragenter', function(e) {
      e.preventDefault();
      _dragCounter++;
      window.dispatchEvent(new CustomEvent('flutter_drag_enter'));
    }, false);

    document.addEventListener('dragleave', function(e) {
      e.preventDefault();
      _dragCounter--;
      if (_dragCounter <= 0) {
        _dragCounter = 0;
        window.dispatchEvent(new CustomEvent('flutter_drag_leave'));
      }
    }, false);

    document.addEventListener('dragover', function(e) {
      e.preventDefault();
    }, false);

    document.addEventListener('drop', function(e) {
      e.preventDefault();
      _dragCounter = 0;
      window.dispatchEvent(new CustomEvent('flutter_drag_leave'));

      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || files.length === 0) return;

      var file = files[0];
      var reader = new FileReader();
      reader.onload = function(evt) {
        // Store as base64 so Dart can read it via js_interop
        var base64 = btoa(
          new Uint8Array(evt.target.result).reduce(
            function(data, byte) { return data + String.fromCharCode(byte); }, ''
          )
        );
        window._flutterDropFileName = file.name;
        window._flutterDropFileBase64 = base64;
        window.dispatchEvent(new CustomEvent('flutter_file_dropped'));
      };
      reader.readAsArrayBuffer(file);
    }, false);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
