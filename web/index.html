<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="645842511929-jr72m5715907vmh716ja48eer2k4dgto.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AttendEase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AttendEase</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Drag-and-drop bridge for Flutter web (works with CanvasKit & SkWasm)
    // Runs outside Flutter's shadow root so events are always captured.
    var _dragCounter = 0;

    document.addEventListener('dragenter', function(e) {
      e.preventDefault();
      _dragCounter++;
      window.dispatchEvent(new CustomEvent('flutter_drag_enter'));
    }, false);

    document.addEventListener('dragleave', function(e) {
      e.preventDefault();
      _dragCounter--;
      if (_dragCounter <= 0) {
        _dragCounter = 0;
        window.dispatchEvent(new CustomEvent('flutter_drag_leave'));
      }
    }, false);

    document.addEventListener('dragover', function(e) {
      e.preventDefault();
    }, false);

    document.addEventListener('drop', function(e) {
      e.preventDefault();
      _dragCounter = 0;
      window.dispatchEvent(new CustomEvent('flutter_drag_leave'));

      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || files.length === 0) return;

      var file = files[0];
      var reader = new FileReader();
      reader.onload = function(evt) {
        // Store as base64 so Dart can read it via js_interop
        var base64 = btoa(
          new Uint8Array(evt.target.result).reduce(
            function(data, byte) { return data + String.fromCharCode(byte); }, ''
          )
        );
        window._flutterDropFileName = file.name;
        window._flutterDropFileBase64 = base64;
        window.dispatchEvent(new CustomEvent('flutter_file_dropped'));
      };
      reader.readAsArrayBuffer(file);
    }, false);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
